[build-system]
requires = ["uv_build>=0.12.0,<0.13.0"]
build-backend = "uv_build"

[project]
name = "fastapi-infra"
version = "0.1.0"
description = "Trusted infrastructure for FastAPI backends."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Talha Ahmad" }]
keywords = ["fastapi", "infrastructure", "backend", "security", "python"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Intended Audience :: Developers",
  "Framework :: FastAPI",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Typing :: Typed",
]
dependencies = []

[project.urls]
Repository = "https://github.com/Talhaahmad9/fastapi-infra"
Issues = "https://github.com/Talhaahmad9/fastapi-infra/issues"

[project.optional-dependencies]
postgres = [
    "psycopg[binary]>=3.3.6,<4",
    "sqlalchemy[asyncio]>=2.0.54,<3",
]

[dependency-groups]
dev = [
    "fastapi<1",
    "httpx2>=2.13,<3",
    "pyright>=1.1.390",
    "pytest>=8.4,<10",
    "pytest-asyncio>=1.4,<2",
    "ruff>=0.9",
]

[tool.uv]
default-groups = ["dev"]

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.format]
quote-style = "double"

[tool.pyright]
typeCheckingMode = "strict"
pythonVersion = "3.12"
include = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-config --strict-markers --tb=short"
xfail_strict = true
asyncio_mode = "strict"
asyncio_default_fixture_loop_scope = "function"
markers = [
  "unit: focused unit and package smoke tests",
  "integration: disposable local postgresql integration tests",
  "hosted: non-destructive hosted supabase smoke tests (opt-in)",
]
